!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de senha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="conteudo">

        <!-- TÍTULO -->
        <div class="conteudo-titulo">

            <img src="unlock.svg" alt="cadeado fechado">

            <h2 class="titulo-principal">
                Gerador de senhas
            </h2>

            <h3 class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura
            </h3>

        </div>


        <!-- SENHA -->
        <div class="conteudo-senha">

            <label for="campo-senha">
                Senha
            </label>

            <input
                name="senha"
                type="text"
                id="campo-senha"
                readonly
            >

            <button id="botao-gerar" type="button">
                Gerar senha
            </button>

        </div>


        <!-- PERSONALIZAÇÃO -->
        <div class="parametro">

            <h3 class="parametro-titulo">
                Personalize sua senha
            </h3>


            <div class="parametro-coluna__senha">


                <!-- QUANTIDADE DE CARACTERES -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Número de caracteres
                    </h4>

                    <div class="parametro-senha-botoes">

                        <button
                            class="parametro-senha__botao"
                            id="botao-menos"
                            type="button">
                            -
                        </button>

                        <p class="parametro-senha__texto">
                            12
                        </p>

                        <button
                            class="parametro-senha__botao"
                            id="botao-mais"
                            type="button">
                            +
                        </button>

                    </div>

                </div>


                <!-- CARACTERÍSTICAS -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Características da senha
                    </h4>


                    <!-- MAIÚSCULAS -->
                    <div class="parametro-senha-checkbox">

                        <input
                            id="maiusculo"
                            name="maiusculo"
                            type="checkbox"
                            class="checkbox"
                            checked
                        >

                        <label for="maiusculo">
                            Letras maiúsculas
                        </label>

                    </div>


                    <!-- MINÚSCULAS -->
                    <div class="parametro-senha-checkbox">

                        <input
                            id="minusculo"
                            name="minusculo"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="minusculo">
                            Letras minúsculas
                        </label>

                    </div>


                    <!-- NÚMEROS -->
                    <div class="parametro-senha-checkbox">

                        <input
                            id="numero"
                            name="numero"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="numero">
                            Números
                        </label>

                    </div>


                    <!-- SÍMBOLOS -->
                    <div class="parametro-senha-checkbox">

                        <input
                            id="simbolo"
                            name="simbolo"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="simbolo">
                            Símbolos
                        </label>

                    </div>

                </div>


                <!-- FORÇA DA SENHA -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Força da senha
                    </h4>

                    <div class="barra"></div>

                    <div class="forca"></div>

                    <div class="parametro-senha-textos">

                        <p>
                            Fraca
                        </p>

                        <p>
                            Média
                        </p>

                        <p>
                            Forte
                        </p>

                    </div>

                    <p class="entropia"></p>

                </div>

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->
    <script src="main.js"></script>

</body>

</html>
